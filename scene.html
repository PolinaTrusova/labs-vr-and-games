<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>СПИНТЕХ — лабораторная №3</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #e8eef4">
      <a-assets>
        <a-asset-item id="lab-model" src="./lab3.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#lab-model"></a-entity>

      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" intensity="1.5" position="-2 3 5"></a-light>

      <a-entity position="0 1.6 4.5" rotation="-15 0 0">
        <a-entity camera look-controls></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
