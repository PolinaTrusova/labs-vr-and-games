<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторная №4 — маркер Hiro</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded
           arjs="sourceType: webcam; debugUIEnabled: false"
           renderer="alpha: true; colorManagement: true"
           vr-mode-ui="enabled: false">

    <a-light type="ambient" intensity="1.1"></a-light>
    <a-light type="directional" intensity="0.8" position="-2 4 3"></a-light>

    <a-marker preset="hiro">
      <a-entity gltf-model="url(./lab4.glb)"
                position="0 0.1 0"
                scale="0.35 0.35 0.35"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
